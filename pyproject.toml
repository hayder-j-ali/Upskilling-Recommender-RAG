[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upskilling-recommender-rag"
version = "0.1.0"
description = "RAG-based upskilling-content recommender — match employees to relevant courses using semantic search + LLM re-ranking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Hayder Ali" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
