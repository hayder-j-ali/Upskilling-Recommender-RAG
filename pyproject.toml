[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upskilling-recommender-rag"
version = "0.1.0"
description = "RAG-based upskilling-content recommender — match employees to relevant courses using semantic search + LLM re-ranking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Hayder Ali" }]
dependencies = [
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    # Declared directly, not just relied on transitively via
    # langchain-google-genai: the Streamlit app catches
    # google.genai.errors.APIError directly to show a clean message on
    # transient 503s instead of a raw traceback.
    "google-genai>=1.0.0",
    "faiss-cpu>=1.8.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "openpyxl>=3.1.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36.0"]
dev = [
    "pytest>=8.0",
    # Pinned to one minor line, deliberately. CI installs fresh on every
    # run, so an open range lets a ruff release turn CI red with no code
    # change — which happened here twice over: newer ruff began flagging
    # RUF100 on `noqa` directives that had become unnecessary, while older
    # ruff flags UP038 on an `isinstance` tuple that current ruff prefers.
    # A range spanning both cannot be satisfied. Bump this consciously.
    "ruff>=0.16,<0.17",
    "streamlit>=1.36.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "vector_store", "output"]

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# Synthetic-data definitions are essentially long string literals; wrapping
# course descriptions across lines would hurt readability with no upside.
"scripts/generate_synthetic_data.py" = ["E501"]

# Entry points bootstrap sys.path so the package is importable without an
# install step, which forces imports below that line. Declared here rather
# than with per-line `noqa` comments: ruff versions disagree about whether
# E402 fires on this pattern at all, and a `noqa` for a rule that doesn't
# fire is itself an error (RUF100). A per-file-ignore is inert either way.
"scripts/*.py" = ["E402"]
"app/streamlit_app.py" = ["E402"]
"tests/test_streamlit_app.py" = ["E402"]
